<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="radarPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes floatGrid {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes radarPing {
        0% { r: 6px; opacity: 0.9; }
        70% { r: 38px; opacity: 0; }
        100% { r: 38px; opacity: 0; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes borderShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .pulse-orb {
        transform-origin: center;
        animation: pulse 5s ease-in-out infinite;
      }
      .radar-needle {
        transform-origin: 1060px 105px;
        animation: radarSweep 4s linear infinite;
      }
      .ping-ring {
        animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .ping-ring-delayed {
        animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        animation-delay: 1.25s;
      }
      .cursor-blink {
        animation: blink 0.9s infinite;
      }
      .border-flow {
        stroke-dasharray: 40 160;
        animation: borderShift 14s linear infinite;
      }
      .glow-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
      .mono-text {
        font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Grid Pattern Decoration -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="80" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-orb" />
  <circle cx="1060" cy="110" r="140" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="pulse-orb" style="animation-delay: -2s;" />
  <circle cx="600" cy="300" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="pulse-orb" style="animation-delay: -3.5s;" />

  <!-- Outer Border With Animated Stroking -->
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="none" stroke="#38bdf8" stroke-width="2.5" class="border-flow" filter="url(#softGlow)" />

  <!-- Badge: Universal AI Skill -->
  <g transform="translate(60, 44)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="18" cy="16" r="5" fill="#10b981" filter="url(#softGlow)" />
    <text x="34" y="21" fill="#e2e8f0" font-size="12" class="mono-text" font-weight="600" letter-spacing="0.5">● UNIVERSAL AI SKILL</text>
  </g>

  <!-- Status Ping Pill -->
  <g transform="translate(285, 44)">
    <rect width="215" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <text x="18" y="21" fill="#a5b4fc" font-size="12" class="mono-text" font-weight="600">🛡️ ZERO-HALLUCINATION</text>
  </g>

  <g transform="translate(515, 44)">
    <rect width="185" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.9" />
    <text x="16" y="21" fill="#d8b4fe" font-size="12" class="mono-text" font-weight="600">⚡ LIVE ATS VERIFIED</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 135)">
    <text class="glow-text" font-size="44" fill="url(#primaryGrad)" filter="url(#softGlow)">
      DAILY VERIFIED JOB SEARCH
    </text>
    <text class="glow-text" font-size="44" fill="url(#primaryGrad)">
      DAILY VERIFIED JOB SEARCH
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 175)">
    <text class="sub-text" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      Evidence-backed autonomous discovery, real-time live link verification &amp; 100-pt fit scoring for any AI agent.
    </text>
  </g>

  <!-- Interactive Terminal Simulation Box -->
  <g transform="translate(60, 215)">
    <rect width="700" height="96" rx="12" fill="#030712" stroke="#334155" stroke-width="1.2" opacity="0.95" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="75" y="22" fill="#64748b" font-size="11" class="mono-text">job-search-daemon — bash — 80x24</text>
    <line x1="0" y1="34" x2="700" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Content Lines -->
    <g transform="translate(18, 56)">
      <text fill="#38bdf8" font-size="13" class="mono-text">➜</text>
      <text x="18" y="0" fill="#f1f5f9" font-size="13" class="mono-text" font-weight="500">skill run daily-verified-job-search --target-roles 5 --live-ats</text>
    </g>
    <g transform="translate(18, 80)">
      <text fill="#10b981" font-size="12" class="mono-text">[✓] HTTP 200 Live Careers Verified</text>
      <text x="255" y="0" fill="#64748b" font-size="12" class="mono-text">|</text>
      <text x="270" y="0" fill="#a78bfa" font-size="12" class="mono-text">Top 10 Ranked</text>
      <text x="380" y="0" fill="#64748b" font-size="12" class="mono-text">|</text>
      <text x="395" y="0" fill="#38bdf8" font-size="12" class="mono-text">Active Cron: 09:00 AM IST</text>
      <rect x="585" y="-11" width="8" height="15" fill="#38bdf8" class="cursor-blink" />
    </g>
  </g>

  <!-- Live Radar Scanner Visual on the Right -->
  <g transform="translate(0, 0)">
    <!-- Radar Base Frame -->
    <circle cx="1030" cy="180" r="95" fill="#030712" stroke="#1e293b" stroke-width="2" opacity="0.85" />
    <circle cx="1030" cy="180" r="68" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />
    <circle cx="1030" cy="180" r="38" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <circle cx="1030" cy="180" r="10" fill="#0284c7" opacity="0.7" />

    <!-- Crosshairs -->
    <line x1="935" y1="180" x2="1125" y2="180" stroke="#334155" stroke-width="1" opacity="0.6" />
    <line x1="1030" y1="85" x2="1030" y2="275" stroke="#334155" stroke-width="1" opacity="0.6" />

    <!-- Pulsing Radar Rings from Target -->
    <circle cx="1030" cy="180" fill="none" stroke="#10b981" stroke-width="2" class="ping-ring" />
    <circle cx="1030" cy="180" fill="none" stroke="#38bdf8" stroke-width="2" class="ping-ring-delayed" />

    <!-- Sweep Beam -->
    <g class="radar-needle" style="transform-origin: 1030px 180px;">
      <path d="M 1030 180 L 1125 180 A 95 95 0 0 0 1097 113 Z" fill="url(#radarPulseGrad)" opacity="0.8" />
      <line x1="1030" y1="180" x2="1125" y2="180" stroke="#10b981" stroke-width="2" filter="url(#softGlow)" />
    </g>

    <!-- Detected Target Blips -->
    <circle cx="1065" cy="140" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="1073" y="143" fill="#bae6fd" font-size="9" class="mono-text" font-weight="700">Google</text>

    <circle cx="980" cy="225" r="3" fill="#a855f7" filter="url(#softGlow)" />
    <text x="987" y="228" fill="#e9d5ff" font-size="9" class="mono-text" font-weight="700">Stripe</text>

    <circle cx="1055" cy="235" r="3.5" fill="#10b981" filter="url(#softGlow)" />
    <text x="1063" y="238" fill="#a7f3d0" font-size="9" class="mono-text" font-weight="700">Meta</text>

    <circle cx="990" cy="130" r="3" fill="#f59e0b" filter="url(#softGlow)" />
    <text x="998" y="133" fill="#fde68a" font-size="9" class="mono-text" font-weight="700">OpenAI</text>

    <!-- Status Sub-label -->
    <rect x="948" y="295" width="164" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <circle cx="962" cy="307" r="4" fill="#10b981" filter="url(#softGlow)" />
    <text x="974" y="312" fill="#6ee7b7" font-size="10.5" class="mono-text" font-weight="600">RADAR: 43 VERIFIED</text>
  </g>
</svg>

