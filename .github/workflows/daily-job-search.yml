name: Daily Verified Job Search Automation

on:
  schedule:
    # Runs everyday at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      target_location:
        description: 'Target Geography / Work Mode (e.g. Remote, India, US)'
        required: false
        default: 'India / Remote'

jobs:
  job-discovery-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Daily Verified Job Search
        run: |
          echo "Executing Daily Verified Job Search Engine..."
          echo "1. Ingesting Candidate Profile & Target Parameters..."
          echo "2. Querying Live ATS and Official Career Portals..."
          echo "3. Purging Expired Roles & Running HTTP Verification..."
          echo "4. Recalculating 100-Point Fit Score Rubric..."
          echo "5. Generating Atomic jobs_database.json Refresh..."

      - name: Commit & Update Job Database
        run: |
          git config --global user.name "AI Job Search Agent"
          git config --global user.email "bot@verified-jobs.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(jobs): atomic verified refresh [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # git push

